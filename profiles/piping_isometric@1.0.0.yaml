version: piping_isometric@1.0.0
geometry:
  min_component_pixels: 25
  max_spur_length_px: 6
  morph_open_kernel_px: 3
  morph_close_kernel_px: 3
  skeleton_prune_iterations: 12
  max_line_fit_residual_px: 2.5
  min_line_length_px: 12.0
  min_r_squared: 0.92
  max_chord_deviation_px: 4.0
  max_turning_angle_deg: 18.0
  stroke_width_percentile: 50.0
snapping:
  max_snap_angle_deg: 4.0
  min_axis_model_confidence: 0.35
  min_primitive_length_px: 20.0
  max_endpoint_displacement_px: 8.0
  max_residual_after_snap_px: 3.5
  endpoint_align_tolerance_px: 6.0
  grid_confidence_min: 0.35
  skip_dimension_region_overlap: true
  dimension_overlap_fraction: 0.25
topology:
  endpoint_cluster_tolerance_px: 8.0
  max_endpoint_angle_delta_deg: 25.0
  intersection_proximity_px: 6.0
  min_branch_angle_deg: 35.0
  collinear_merge_max_gap_px: 14.0
  collinear_angle_tolerance_deg: 8.0
  ink_bridge_sample_step_px: 3.0
  min_ink_bridge_coverage: 0.45
  symbol_region_buffer_px: 4.0
  min_hypothesis_margin: 0.15
  elbow_angle_min_deg: 55.0
  elbow_angle_max_deg: 130.0
ocr:
  model_id: microsoft/trocr-base-handwritten
  model_revision: null
  min_confidence: 0.45
  conflict_margin: 0.08
  crop_padding_px: 6
  deskew_enabled: true
  context_radius_px: 48.0
  vocabulary_terms:
    - NPT
    - valve
    - main
    - drop
    - clamp
    - strut
    - flange
    - elbow
    - tee
    - connection
    - threaded
  abbreviations:
    conn: connection
    conn.: connection
    thrd: threaded
    maint: maintenance
symbols:
  library_version: piping-symbols@1.1.0
  classifier_backend: template
  allowed_symbol_ids:
    - ball_valve
    - block_bleed_assembly
    - tee_fitting
    - elbow_fitting
    - flange
    - threaded_connection
    - drop
    - riser
    - endpoint
    - flow_arrow
    - equipment_connection
    - unknown
  min_shape_score: 0.35
  min_context_score: 0.0
  min_combined_margin: 0.08
  port_attach_tolerance_px: 12.0
  nearby_text_radius_px: 64.0
  suppress_on_structural_junction: true

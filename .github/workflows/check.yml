name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install
        run: ./scripts/setup
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @isometric/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: apps/web
        run: pnpm exec playwright install-deps chromium
      - name: Check (ends with Playwright E2E; starts the API and web app)
        run: ./scripts/check
      - name: Upload Playwright screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e
          path: |
            apps/web/e2e/screenshots
            apps/web/e2e/.report
            apps/web/e2e/.results
          if-no-files-found: ignore

name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: isometric
          POSTGRES_PASSWORD: isometric
          POSTGRES_DB: isometric
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U isometric -d isometric"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LOCAL_DATABASE_URL: postgresql://isometric:isometric@localhost:5432/isometric
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install
        run: ./scripts/setup
      - name: Check
        run: ./scripts/check
